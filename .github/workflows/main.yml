name: Tests and Linting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run StandardRb linting
        run: bundle exec standardrb
      - name: Run specs
        run: bundle exec rspec spec

  # Single check for the main branch ruleset to require, so the Ruby matrix can
  # change without updating the ruleset.
  all-ruby-versions:
    runs-on: ubuntu-latest
    name: All Ruby versions
    needs: build
    if: always()
    steps:
      - name: Check matrix result
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.build.result }}
