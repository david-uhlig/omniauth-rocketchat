name: Compatibility Matrix

# Tests the latest release of this gem against the first and the latest patch
# release of every Rocket Chat minor version that isn't EOL and opens a pull request that updates the README's matrix. Results
# are cached in .github/compat.json, so each combination is tested once.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-matrix

env:
  BRANCH: compat-matrix

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Results waiting in the open pull request don't need to be tested again
      - name: Use the cache of the open pull request
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            git fetch origin "$BRANCH"
            git checkout FETCH_HEAD -- .github/compat.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: plan
        run: bin/compat-matrix plan >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    name: Rocket Chat ${{ matrix.version }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the library of ${{ needs.plan.outputs.tag }}
        run: |
          git fetch --depth=1 origin tag "$TAG"
          git rm -rq lib
          git checkout "$TAG" -- lib
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # A failing flow is a result, not an error. Only fail when there is no result.
      - name: Run bin/compat
        run: bin/compat --json results.json "$VERSION" || test -f results.json
        env:
          VERSION: ${{ matrix.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: compat-${{ matrix.version }}
          path: results.json

  update:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Use the cache of the open pull request
        id: pr
        run: |
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            git fetch origin "$BRANCH"
            git checkout FETCH_HEAD -- .github/compat.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.versions != '[]'
        with:
          pattern: compat-*
          path: results
      - name: Update the cache and the README
        run: |
          shopt -s nullglob
          bin/compat-matrix update --tag "$TAG" results/*/results.json
        env:
          TAG: ${{ needs.plan.outputs.tag }}
      - name: Open or update the pull request
        run: |
          git add README.md .github/compat.json
          if git diff --cached --quiet HEAD; then
            echo "main is up to date"
            exit 0
          fi
          if [ -n "$PR" ] && git diff --cached --quiet FETCH_HEAD; then
            echo "Pull request #$PR is up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "Update Rocket Chat compatibility matrix"
          git push --force origin "$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --head "$BRANCH" --title "Update Rocket Chat compatibility matrix" \
              --body "Generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          # Pull requests opened with the workflow token don't trigger workflows,
          # so run the required checks explicitly.
          gh workflow run main.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
